task:
  status: "not_started"
  goal: ""
  source_plan: "docs/superpowers/plans/YYYY-MM-DD-feature.md"
  current_task: "Task N: short task name"
  allowed_paths:
    # - "src/example/**"
    # - "tests/example/**"
  forbidden_paths:
    # - "src/auth/**"
    # - "src/billing/**"
    # - ".github/workflows/**"
  max_changed_files: null
  max_diff_lines: null
  # Example limits for a scoped task:
  # max_changed_files: 4
  # max_diff_lines: 250

  completion:
    # Set true for teams or tasks that require recorded TDD evidence.
    requires_tdd_evidence: false
    requires_scope_check: true
    requires_policy_check: true
    requires_verification: true
    requires_handoff_update: true
    requires_acceptance_check: false
    requires_review_evidence: false
    requires_subagent_evidence: false
    # Set true only when this task must prove delegated execution via at least
    # one validated .agent/subagent-runs/<run>/ directory.

last_verified:
  command: ""
  result: ""

blockers: []
